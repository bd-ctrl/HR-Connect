<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CUBIC CONNECT · ตัวอย่างเส้นทางฟีดแบ็ก</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap');
:root{--ink:#34313f;--muted:#777381;--purple:#7056ad;--green:#397b70;--line:#eae5ed;--pink:#f4b7b0}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.7 'Noto Sans Thai',sans-serif;background:radial-gradient(at 0 0,#f9d9d4,transparent 45%),radial-gradient(at 100% 15%,#dfeaf9,transparent 45%),radial-gradient(at 70% 100%,#fff0d3,transparent 55%),#faf8f7;min-height:100vh}button,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b8a5dd;outline-offset:4px}header{max-width:1150px;margin:auto;padding:27px 28px 15px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:900 24px/1.1 Nunito,sans-serif;color:#66509d;letter-spacing:-.7px}.brand span{color:#eeb650}.brand small{display:block;font:600 9px 'Noto Sans Thai';letter-spacing:2px;margin-top:9px;color:#948596}main{max-width:1100px;margin:0 auto;padding:20px 28px 130px}h1{font-size:30px;line-height:1.4;letter-spacing:-.6px;margin:8px 0}h2{font-size:20px;line-height:1.5;margin:0 0 10px}h3{font-size:16px;margin:0 0 6px}p{margin:6px 0}.muted{color:var(--muted)}.eyebrow{font:800 11px Nunito,sans-serif;letter-spacing:2px;color:#8e7eaa}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:4px 10px;font-size:11px;font-weight:600;background:#eee8f6;color:#756294}.pill.green{background:#e3f1e8;color:#397b70}.pill.peach{background:#fff0e1;color:#9c6a34}.pill.gray{background:#f0edf1;color:#79727f}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.topcopy{margin:10px 0 24px}.card{background:#fffdfb;border:1px solid #fff;border-radius:24px;padding:25px;box-shadow:0 10px 40px #67575f06}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:22px}.stack{display:grid;gap:18px;align-content:start}.hero{background:linear-gradient(120deg,#fbebed,#f0edf9 70%,#e5eff0);position:relative;min-height:210px;display:flex;align-items:center;overflow:visible}.hero .copy{flex:1}.hero img{mix-blend-mode:multiply;mask-image:radial-gradient(ellipse,black 50%,transparent 74%);width:145px;height:165px;object-fit:contain;flex-shrink:0}.hero h2{font-size:27px;color:#71609a;line-height:1.5}.hero p{max-width:330px}.count{font:900 32px Nunito,sans-serif;color:#527f79}.tabs{display:flex;gap:5px;background:#eee8f1;border-radius:14px;padding:5px;margin-bottom:20px;width:fit-content}.tabs button{border:0;padding:9px 17px;border-radius:11px;background:none;color:#81758a;font-weight:600}.tabs button.active{background:white;color:var(--purple);box-shadow:0 3px 8px #5d436410}.feedback{border:1px solid var(--line);border-radius:19px;padding:20px;background:white}.anonymous{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px}.avatar{display:grid;place-items:center;background:#ece5f6;color:#8a73ae;border-radius:50%;width:32px;height:32px}.stars{color:#e6b547;letter-spacing:3px;font-size:20px}.dim{font-size:12px;color:var(--green);font-weight:600}.quote{margin-top:10px;font-size:15px;line-height:1.9}.meta{margin-top:15px;display:flex;flex-wrap:wrap;gap:8px}.hint{border-radius:15px;padding:15px 17px;background:#f4f0f8;color:#7d718e;font-size:13px;line-height:1.85}.hint.green{background:#edf4f1;color:#537a6c}.hint.peach{background:#fff2e7;color:#9b795d}.btn{border:0;border-radius:13px;padding:11px 18px;background:#7157ad;color:white;font-weight:600;display:inline-block;text-decoration:none;text-align:center}.btn.soft{background:#eee8f7;color:#74619a}.btn.reject{background:#f8e7e8;color:#aa6271}.btn.text{background:transparent;color:#83798d;padding:7px 0}.divider{border-top:1px solid var(--line);margin:20px 0}.step{display:flex;gap:13px;align-items:flex-start;padding:12px 0}.step .bubble{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#eee8f8;color:#7e65ad;flex-shrink:0;font-weight:700;font-size:12px}.step p{font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:20px 0}.stat{padding:18px;background:#fffdfb;border-radius:18px;border:1px solid white}.stat strong{display:block;font:900 25px Nunito,sans-serif;margin-top:5px;color:#796298}.stat small{color:var(--muted);font-size:12px}.case{margin-bottom:17px}.case blockquote{margin:16px 0;padding:14px 17px;background:#fbf6f1;border-left:3px solid #edcab2;border-radius:0 12px 12px 0;font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.case h3{font-size:18px}.score{font:900 24px Nunito;color:#b88746}.bars{margin-top:18px}.barrow{display:grid;grid-template-columns:100px 1fr 42px;align-items:center;gap:12px;margin:16px 0;font-size:13px}.track{height:9px;background:#f0edf3;border-radius:8px}.track i{display:block;height:100%;border-radius:8px;background:#b09bcc}.barrow:nth-child(2) i{background:#8fbdb1}.barrow:nth-child(3) i{background:#e1a7b8}.bigscore{font:900 65px Nunito;color:#6d569f;line-height:1.2}.bigscore small{font-size:22px;color:#ada3b7}.lock{text-align:center;padding:35px 20px}.lock img{width:130px;height:145px;object-fit:contain}.lock h2{color:#5a7f7a}.lock p{font-size:14px}.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:#fffdfbf0;backdrop-filter:blur(15px);border:1px solid white;border-radius:22px;box-shadow:0 9px 35px #5b446419;z-index:5;max-width:calc(100% - 24px)}.nav button{border:0;background:none;min-width:115px;padding:10px 18px;color:#918696;border-radius:15px;font-size:12px;font-weight:600;white-space:nowrap}.nav button.active{background:#ece6f6;color:#7057a8}.nav svg{width:25px;height:25px;display:block;margin:0 auto 3px}select{padding:8px 12px;border:1px solid #e6deeb;border-radius:12px;background:#fffdfa;color:#685e75;font-size:12px;max-width:100%}label{display:block;font-weight:600;font-size:13px;margin:12px 0 7px}textarea{width:100%;border:1px solid #dfd6e8;border-radius:12px;min-height:90px;padding:12px;background:#fffdfa;color:var(--ink);resize:vertical}dialog{border:0;border-radius:23px;padding:26px;max-width:520px;width:calc(100% - 32px);color:var(--ink);box-shadow:0 25px 100px #3e29473a}dialog::backdrop{background:#39314150;backdrop-filter:blur(4px)}.error{color:#a65367;font-size:12px;min-height:20px}footer{margin-top:28px;text-align:center;font-size:11px;color:#a297a5}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#4c405d;color:white;padding:13px 20px;border-radius:15px;z-index:20;max-width:90vw;font-size:13px}.filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.notice-count{font-size:12px;font-weight:600;color:#8d7b9d}.empty{padding:30px 10px;text-align:center;color:#8c8094}.reviewed{border-left:3px solid #91b8a7;padding-left:15px;margin-top:15px}.scope{font-size:11px;color:#8a7d91}.preview-banner{max-width:1100px;margin:0 auto;background:#f3eaf6;color:#806891;padding:8px 20px;text-align:center;border-radius:12px;font-size:11px}.badge-icon{font-size:20px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:700px){header{padding:22px 20px 14px}.brand{font-size:21px}.brand small{font-size:8px}main{padding:18px 18px 130px}.grid{grid-template-columns:1fr}.card{padding:21px;border-radius:22px}h1{font-size:26px}.hero{min-height:190px}.hero img{width:110px;height:140px}.hero h2{font-size:23px}.hero p{font-size:13px}.nav{bottom:10px;gap:3px;width:calc(100% - 24px);justify-content:space-around}.nav button{padding:8px 10px;min-width:0;flex:1;font-size:11px}.summary{gap:8px}.stat{padding:12px}.stat small{font-size:10px}.stat strong{font-size:22px}.barrow{grid-template-columns:85px 1fr 36px;gap:9px}.tabs{width:100%}.tabs button{flex:1;padding:9px 8px;font-size:13px}.pill{font-size:10px}.preview-banner{margin:0 16px}.bigscore{font-size:55px}.feedback{padding:17px}.row{align-items:center}dialog{padding:22px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}} 
</style></head><body>
<header><div class="brand">CUBIC CONNECT<span>✦</span><small>SUITCUBE · PEOPLE & CULTURE</small></div><div><span class="pill peach">UI PROTOTYPE</span><p class="scope">ข้อมูลสมมติทั้งหมด</p></div></header>
<div class="preview-banner">พื้นที่ทดลองหน้าจอ · ไม่มีการล็อกอินหรือส่งข้อมูลพนักงานจริง · รีเฟรชเพื่อเริ่มใหม่</div>
<main id="app"></main><nav class="nav" aria-label="เมนูตัวอย่าง"><button data-view="received"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#f0b0c8" d="M4 5h24v19H14l-8 5v-5H4z"/><path fill="#c6618e" d="M16 10c-6-5-9 3 0 8 9-5 6-13 0-8"/></svg>ฟีดแบ็กของฉัน</button><button data-view="score"><svg viewBox="0 0 32 32" aria-hidden="true"><rect fill="#dca1be" x="4" y="19" width="6" height="11" rx="2"/><rect fill="#b79ad8" x="13" y="11" width="6" height="19" rx="2"/><rect fill="#7f68b2" x="22" y="3" width="6" height="27" rx="2"/></svg>คะแนนจบรอบ</button><button data-view="hr"><svg viewBox="0 0 32 32" aria-hidden="true"><rect fill="#93beaf" x="5" y="5" width="23" height="25" rx="5"/><rect fill="#518477" x="11" y="2" width="11" height="7" rx="3"/><path d="m10 20 4 4 9-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>HR · จำลอง</button></nav>
<dialog id="review-dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const dims=['ความเร็ว','ความถูกต้อง','การสื่อสาร'];
const blankState=()=>({released:false,batch:'ready',filter:'pending',decisions:{},audit:[]});let state=blankState(),view=['received','score','hr'].includes(new URLSearchParams(location.search).get('view'))?new URLSearchParams(location.search).get('view'):'received';
const rows=[
 {id:'a',rater:'synthetic-a',scores:[5,5,5],reasons:['แจ้งความคืบหน้าก่อนถึงกำหนด ทำให้ทีมวางแผนต่อได้ง่าย','ตรวจข้อมูลครบก่อนส่ง ทีมจึงทำงานต่อได้ราบรื่น','อธิบายอย่างสุภาพและรับฟัง ช่วยให้การประสานงานสบายใจ']},
 {id:'b',rater:'synthetic-b',scores:[4,4,4],reasons:['ส่งงานภายในเวลาที่ตกลง ขอบคุณที่ช่วยให้ทีมเดินหน้าต่อได้','','แจ้งสิ่งที่ต้องเตรียมชัดเจน เข้าใจตรงกันตั้งแต่แรก']},
 {id:'c',rater:'synthetic-c',scores:[4,4,5],reasons:['ตอบรับและช่วยติดตามงานจนเสร็จ','','ประสานงานสุภาพ แม้มีการปรับรายละเอียดหลายครั้ง']},
 {id:'d',rater:'synthetic-d',scores:[2,3,4],reasons:['ส่งข้อมูลหลังเวลาที่ตกลง 2 วัน โดยไม่มีการแจ้งล่วงหน้า ทำให้ทีมต้องเลื่อนขั้นตอนต่อไป','ข้อมูลที่ส่งขาดบางรายการ ต้องขอรายละเอียดเพิ่มเติมก่อนนำไปใช้','']}
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decision=(r,i)=>r.scores[i]>=4?'auto':state.decisions[r.id+':'+i]?.status||'pending';
const activeRows=()=>state.batch==='small'?rows.slice(0,2):rows;
function calculate(){const ds=dims.map((_,i)=>{const rs=activeRows().filter(r=>['auto','approved'].includes(decision(r,i)));return {count:new Set(rs.map(r=>r.rater)).size,mean:rs.length>=3?rs.reduce((n,r)=>n+r.scores[i],0)/rs.length:null}});return {dims:ds,overall:ds.every(d=>d.mean!==null)?ds.reduce((n,d)=>n+d.mean,0)/3:null}}
function pending(){return activeRows().flatMap(r=>r.scores.map((score,i)=>({r,i,score})).filter(x=>x.score<=3&&decision(r,x.i)==='pending'))}
const fmt=n=>n===null?'—':n.toFixed(2),stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function title(k,h,p){return `<div class="topcopy"><div class="eyebrow">${k}</div><h1>${h}</h1><p class="muted">${p}</p></div>`}
function feedbackCard(r,i,reviewed=false){const d=state.decisions[r.id+':'+i];const text=reviewed?d?.summary:r.reasons[i];return `<article class="feedback"><div class="row"><div class="anonymous"><span class="avatar" aria-hidden="true">✦</span>ไม่ระบุตัวตน</div><span class="dim">${dims[i]}</span></div><div class="row" style="margin-top:12px"><span class="stars" aria-label="${r.scores[i]} จาก 5 ดาว">${stars(r.scores[i])}</span><span class="pill ${reviewed?'gray':'green'}">${reviewed?'HR ตรวจสอบแล้ว':'คำชื่นชม'}</span></div><p class="quote">${esc(text||'ผู้ประเมินไม่ได้ระบุข้อความเพิ่มเติม')}</p></article>`}
function received(){const high=activeRows().flatMap(r=>r.scores.map((s,i)=>({r,i,s})).filter(x=>x.s>=4));const released=state.batch==='ready'&&dims.every((_,i)=>new Set(high.filter(x=>x.i===i).map(x=>x.r.rater)).size>=3);return title('MY FEEDBACK','ทุกความตั้งใจ มีคนมองเห็น','คำชื่นชมเล็ก ๆ ที่ช่วยเติมพลังให้วันทำงานของคุณ')+`<div class="grid"><div class="stack"><section class="card hero"><div class="copy"><span class="pill green">ฟีดแบ็กระหว่างรอบ</span><h2 style="margin-top:12px">เก็บคำดี ๆ<br>ไว้เป็นพลังใจ</h2><p class="muted">คำชื่นชมแยกจากคะแนนเฉลี่ย<br>ผลคะแนนอย่างเป็นทางการจะเปิดจบรอบ</p></div><img src="assets/rating-4.gif" alt="น้องดาวยิ้มให้กำลังใจ"></section><section class="card"><div class="row"><h2>คำชื่นชมที่ได้รับ</h2><span class="pill gray">ไม่แสดงชื่อผู้ให้</span></div><p class="muted" style="font-size:12px;margin-bottom:18px">รอบตุลาคม 2569 · แสดงเป็นชุด ไม่แสดงเวลาส่งหรือชื่อโปรเจกต์</p><div class="stack">${released?high.map(x=>feedbackCard(x.r,x.i)).join(''):`<div class="empty"><span class="badge-icon">✦</span><h3>รอฟีดแบ็กพร้อมแสดง</h3><p>${state.batch==='small'?'ข้อมูลยังไม่ครบเกณฑ์ขั้นต่ำ จึงยังไม่แสดงคะแนนหรือข้อความ':'รวบรวมฟีดแบ็กเป็นชุดก่อนเผยแพร่ เพื่อช่วยปกป้องผู้ให้ความคิดเห็น'}</p></div>`}</div></section></div><aside class="stack"><section class="card"><h3>พื้นที่นี้แสดงอะไรบ้าง?</h3><div class="step"><span class="bubble">1</span><div><strong>คำชื่นชม 4–5 ดาว</strong><p>แสดงเมื่อมีข้อมูลผ่านเกณฑ์ความเป็นส่วนตัวและพร้อมเผยแพร่เป็นชุด</p></div></div><div class="step"><span class="bubble">2</span><div><strong>เหตุผลที่คนอื่นชื่นชมคุณ</strong><p>ผู้ให้จะใส่หรือไม่ใส่ข้อความก็ได้</p></div></div><div class="step"><span class="bubble">3</span><div><strong>เห็นเฉพาะฟีดแบ็กของคุณ</strong><p>ไม่แสดงตัวตนผู้ให้หรือคะแนนของเพื่อนร่วมงาน</p></div></div><div class="hint">คำชื่นชมระหว่างรอบยังไม่ใช่คะแนนเฉลี่ยอย่างเป็นทางการ</div><button class="btn soft" data-view="score" style="margin-top:16px;width:100%">ดูสถานะคะแนนจบรอบ</button></section><section class="card"><label for="batch">ลองสถานะการแสดงผล · จำลอง</label><select id="batch"><option value="ready" ${state.batch==='ready'?'selected':''}>พร้อมแสดงเป็นชุด</option><option value="waiting" ${state.batch==='waiting'?'selected':''}>รอเผยแพร่เป็นชุด</option><option value="small" ${state.batch==='small'?'selected':''}>ผู้ประเมินไม่ครบ 3 คน</option></select><p class="scope">ตัวเลือกนี้ใช้ตรวจหน้าจอต้นแบบเท่านั้น</p></section></aside></div>`}
function barHTML(result){return `<div class="bars">${dims.map((d,i)=>`<div class="barrow"><span>${d}</span><div class="track"><i style="width:${(result.dims[i].mean||0)*20}%"></i></div><strong>${fmt(result.dims[i].mean)}</strong></div>`).join('')}</div>`}
function scoreView(){const result=calculate();const low=activeRows().flatMap(r=>r.scores.map((s,i)=>({r,i,s})).filter(x=>x.s<=3&&decision(r,x.i)==='approved'&&result.dims[x.i].mean!==null));return title('MY ROUND RESULT','คะแนนจบรอบของฉัน','ผลที่ผ่านกระบวนการตรวจสอบ และพร้อมสำหรับการพัฒนาร่วมกัน')+`<div class="grid"><div class="stack">${!state.released?`<section class="card lock"><img src="assets/rating-3.png" alt="น้องดาวกำลังรอผล"><h2>รอเผยแพร่คะแนนจบรอบ</h2><p class="muted">ผลคะแนนจะเปิดพร้อมกันหลังปิดรอบ<br>และ HR ตรวจสอบเสร็จแล้ว</p><span class="pill gray" style="margin-top:16px">ยังไม่แสดงค่าเฉลี่ยระหว่างรอบ</span><div class="divider"></div><p class="scope">ยังดูคำชื่นชมที่พร้อมแสดงได้ในหน้าฟีดแบ็กของฉัน</p><button class="btn soft" data-view="received" style="margin-top:14px">กลับไปอ่านคำชื่นชม</button></section>`:`<section class="card"><div class="row"><span class="pill green">เผยแพร่ผลจบรอบแล้ว</span><span class="scope">ตุลาคม 2569</span></div><h2 style="margin-top:20px">ภาพรวมความร่วมมือของฉัน</h2><div class="bigscore">${fmt(result.overall)}<small> / 5</small></div><p class="muted" style="font-size:12px">${result.overall===null?'ข้อมูลไม่เพียงพอในบางด้าน จึงยังไม่แสดงคะแนนรวม':'ค่าเฉลี่ย 3 ด้าน น้ำหนักเท่ากัน'}</p>${barHTML(result)}<div class="hint green">ใช้เฉพาะคะแนนที่ผ่านเกณฑ์และการตรวจสอบแล้ว แต่ละด้านต้องมีผู้ประเมินที่นำมาคำนวณได้อย่างน้อย 3 คน</div></section><section class="card"><h2>เรื่องที่ชวนพัฒนาร่วมกัน</h2><p class="muted" style="font-size:12px;margin-bottom:17px">เฉพาะข้อมูลที่ HR ตรวจสอบและเรียบเรียงก่อนเผยแพร่</p><div class="stack">${low.length?low.map(x=>feedbackCard(x.r,x.i,true)).join(''):'<div class="empty">ไม่มีข้อเสนอแนะเพื่อพัฒนาที่พร้อมเผยแพร่ในรอบนี้</div>'}</div></section>`}</div><aside class="stack"><section class="card"><h3>คะแนนนี้มาจากอะไร?</h3><div class="step"><span class="bubble">✓</span><div><strong>คะแนน 4–5 ดาว</strong><p>ผ่านอัตโนมัติ พร้อมใช้เมื่อถึงรอบคำนวณ</p></div></div><div class="step"><span class="bubble">✓</span><div><strong>คะแนน 1–3 ดาว</strong><p>ใช้เฉพาะรายการที่ HR ตรวจสอบข้อเท็จจริงและอนุมัติแล้ว</p></div></div><div class="hint">ผู้รับจะไม่เห็นรายการรอตรวจสอบ รายการ Reject หรือตัวตนผู้ประเมิน</div></section><section class="card"><span class="pill peach">สำหรับลองหน้าจอเท่านั้น</span><p class="muted" style="font-size:13px;margin:12px 0">สลับไปมุม HR จำลอง เพื่อลองตรวจสอบและเผยแพร่ผล</p><button class="btn soft" data-view="hr">ลองมุม HR</button></section></aside></div>`}
function hrView(){const all=activeRows().flatMap(r=>r.scores.map((score,i)=>({r,i,score})).filter(x=>x.score<=3));const items=all.filter(x=>state.filter==='all'||decision(x.r,x.i)===state.filter);const result=calculate(),enough=new Set(activeRows().map(r=>r.rater)).size>=3;return title('HR REVIEW · DEMO','ตรวจสอบก่อนส่งต่อ','พื้นที่จำลองของ HR Manager / HR Admin · พิจารณาแยกทีละด้าน')+`<div class="hint peach">คะแนนและเหตุผลในหน้านี้เป็นข้อมูลสมมติทั้งหมด มุมพนักงานไม่เห็นรายการรอตรวจสอบหรือสถานะ Reject</div><div class="summary"><div class="stat"><small>รอตรวจสอบ</small><strong>${enough?pending().length:'—'}</strong></div><div class="stat"><small>อนุมัติแล้ว</small><strong>${all.filter(x=>decision(x.r,x.i)==='approved').length}</strong></div><div class="stat"><small>ไม่นำมาคำนวณ</small><strong>${all.filter(x=>decision(x.r,x.i)==='rejected').length}</strong></div></div><div class="grid"><section class="card"><div class="row"><h2>คิวคะแนน 1–3 ดาว</h2><span class="pill peach">SLA ตัวอย่าง · 3 วัน</span></div><div class="filter"><label class="sr-only" for="filter">กรองสถานะ</label><select id="filter">${[['pending','รอตรวจสอบ'],['approved','อนุมัติแล้ว'],['rejected','Reject แล้ว'],['all','ทั้งหมด']].map(([v,l])=>`<option value="${v}" ${state.filter===v?'selected':''}>${l}</option>`).join('')}</select><span class="notice-count">ประเมินจากประสบการณ์ร่วมงานจริง</span></div>${!enough?'<div class="empty">ผู้ประเมินไม่ครบ 3 คน<br>ไม่นำข้อมูลชุดนี้เข้าสู่คิวหรือการคำนวณ</div>':items.length?items.map(x=>{const st=decision(x.r,x.i),d=state.decisions[x.r.id+':'+x.i];return `<article class="feedback case"><div class="row"><div><span class="dim">${dims[x.i]}</span><h3>พนักงานตัวอย่าง · BA</h3></div><span class="score">${x.score}<small> / 5</small></span></div><span class="pill gray">ไม่แสดงชื่อผู้ประเมิน</span><blockquote>${esc(x.r.reasons[x.i])}</blockquote><p class="scope">${st==='pending'?'ยังไม่ส่งคะแนนหรือข้อความให้ผู้รับ':st==='approved'?'อนุมัติแล้ว · พร้อมนำไปคำนวณจบรอบ':'Reject แล้ว · ไม่นำไปคำนวณและไม่แจ้งทั้งสองฝ่าย'}</p>${d?`<div class="reviewed"><strong class="dim">บันทึก HR · จำกัดเฉพาะหลังบ้าน</strong><p style="font-size:13px">${esc(d.note)}</p>${st==='approved'?`<p class="scope">ข้อความพร้อมเผยแพร่: ${esc(d.summary)}</p>`:''}</div>`:''}${st==='pending'&&!state.released?`<div class="actions"><button class="btn" data-review="${x.r.id}:${x.i}:approved">Approve</button><button class="btn reject" data-review="${x.r.id}:${x.i}:rejected">Reject</button></div>`:''}</article>`}).join(''):'<div class="empty">ไม่มีรายการในสถานะนี้<br><button class="btn text" id="all-cases">ดูรายการทั้งหมด</button></div>'}</section><aside class="stack"><section class="card"><span class="pill gray">เฉพาะ HR · ยังไม่ใช่ผลเผยแพร่</span><h2 style="margin-top:15px">ตัวอย่างผลคำนวณ</h2><div class="bigscore" style="font-size:46px">${fmt(result.overall)}<small> / 5</small></div>${barHTML(result)}<p class="scope">คะแนนรอตรวจสอบและ Reject ไม่อยู่ทั้งตัวตั้งและตัวหาร อนุมัติแล้วจึงคำนวณใหม่</p><div class="divider"></div><h3>เผยแพร่พร้อมกันจบรอบ</h3><p class="muted" style="font-size:13px">ตรวจทุกกรณีให้ครบก่อน ผู้รับจึงเห็นคะแนนอย่างเป็นทางการ</p><button class="btn" id="publish" style="width:100%;margin-top:15px" ${pending().length||state.released||!enough?'disabled':''}>${state.released?'เผยแพร่แล้ว':'ปิดรอบและเผยแพร่ผล'}</button>${pending().length&&enough?'<p class="scope">ยังมีรายการรอตรวจสอบ จึงยังเผยแพร่ไม่ได้</p>':''}</section><section class="card"><h3>หลักในการพิจารณา</h3><p class="muted" style="font-size:13px">ตรวจพฤติกรรม บริบท และผลต่องาน ใช้เกณฑ์เดียวกันทุกคน ไม่ Reject เพียงเพราะเป็นคะแนนต่ำ</p><div class="hint" style="margin-top:12px">ทุกการตัดสินใจต้องมีบันทึกเหตุผล ผู้รับเห็นเฉพาะข้อความที่พร้อมเผยแพร่</div><button class="btn text" id="reset">เริ่มตัวอย่างใหม่</button></section></aside></div>`}
function render(){document.getElementById('app').innerHTML=({received,score:scoreView,hr:hrView}[view])()+`<footer>CUBIC CONNECT · ฟังกัน เข้าใจกัน เติบโตไปด้วยกัน<br>ต้นแบบ UI · ข้อมูลในหน่วยความจำเบราว์เซอร์ ไม่ใช่ระบบสิทธิ์ HR หรือฐานข้อมูลจริง</footer>`;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();window.scrollTo(0,0)});document.querySelector('#batch')?.addEventListener('change',e=>{state.batch=e.target.value;state.released=false;render()});document.querySelector('#filter')?.addEventListener('change',e=>{state.filter=e.target.value;render()});document.querySelector('#all-cases')?.addEventListener('click',()=>{state.filter='all';render()});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review));document.querySelector('#publish')?.addEventListener('click',publish);document.querySelector('#reset')?.addEventListener('click',()=>{state=blankState();render();toast('เริ่มข้อมูลตัวอย่างใหม่แล้ว')})}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;setTimeout(()=>el.hidden=true,3000)}
function review(key){const [id,index,status]=key.split(':'),i=Number(index),r=activeRows().find(r=>r.id===id);if(!r||r.scores[i]>=4||decision(r,i)!=='pending'||state.released||new Set(activeRows().map(r=>r.rater)).size<3)return;const approved=status==='approved';const dialog=document.getElementById('review-dialog');dialog.innerHTML=`<h2 id="dialog-title">${approved?'อนุมัติคะแนนด้านนี้':'Reject คะแนนด้านนี้'}</h2><span class="pill peach">${dims[i]} · ${r.scores[i]} ดาว</span><p class="muted" style="font-size:13px;margin-top:12px">${approved?'คะแนนจะพร้อมใช้คำนวณ แต่ผู้รับจะเห็นเมื่อเผยแพร่จบรอบ':'ไม่นำคะแนนนี้ไปคำนวณ ไม่แจ้งผู้ให้หรือผู้รับ'}</p><form id="decision-form"><label for="note">ข้อเท็จจริง / เหตุผลการตัดสินใจ *</label><textarea id="note" required maxlength="500" placeholder="บันทึกผลการตรวจสอบ ใช้เฉพาะ HR"></textarea>${approved?'<label for="summary">ข้อความสำหรับผู้รับหลังเผยแพร่ *</label><textarea id="summary" required maxlength="500" placeholder="สรุปประเด็นพัฒนาโดยตัดชื่อ โปรเจกต์เฉพาะ และรายละเอียดระบุตัวผู้ให้"></textarea>':''}<p id="decision-error" class="error" role="alert"></p><div class="actions"><button class="btn ${approved?'':'reject'}" type="submit">ยืนยัน ${approved?'Approve':'Reject'}</button><button class="btn soft" type="button" id="cancel">กลับไปตรวจสอบ</button></div></form>`;dialog.showModal();dialog.querySelector('#cancel').onclick=()=>dialog.close();dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const note=dialog.querySelector('#note').value.trim(),summary=dialog.querySelector('#summary')?.value.trim()||'';if(!note||(approved&&!summary)){dialog.querySelector('#decision-error').textContent='กรุณากรอกข้อมูลที่จำเป็นให้ครบ';return}if(decision(r,i)!=='pending'||state.released)return;state.decisions[id+':'+i]={status,note,summary};state.audit.push({key:id+':'+i,status,note});dialog.close();render();toast(approved?'อนุมัติแล้ว · พร้อมคำนวณจบรอบ':'Reject แล้ว · ไม่ส่งแจ้งเตือนพนักงาน')};}
function publish(){if(pending().length||state.released||new Set(activeRows().map(r=>r.rater)).size<3)return;const dialog=document.getElementById('review-dialog');dialog.innerHTML='<h2 id="dialog-title">เผยแพร่ผลจบรอบ?</h2><p>ตรวจสอบคะแนนครบแล้ว ผู้รับจะเห็นเฉพาะคะแนนที่ผ่านเกณฑ์และข้อความที่ HR เรียบเรียงไว้</p><div class="actions"><button class="btn" id="confirm-publish">ยืนยันเผยแพร่</button><button class="btn soft" id="cancel-publish">กลับ</button></div>';dialog.showModal();dialog.querySelector('#cancel-publish').onclick=()=>dialog.close();dialog.querySelector('#confirm-publish').onclick=()=>{if(pending().length||state.released)return;state.released=true;dialog.close();view='score';render();window.scrollTo(0,0);toast('เผยแพร่ผลตัวอย่างแล้ว')};}
render();
</script></body></html>
