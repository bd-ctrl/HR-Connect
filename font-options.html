<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CUBIC CONNECT · เลือกฟอนต์ 5 แบบ</title>

<style>*{box-sizing:border-box}body{margin:0;color:#3e354b;background:radial-gradient(at 0 0,#f5d9d6,transparent 55%),radial-gradient(at 100% 30%,#dfe9f8,transparent 50%),#f9f6f4;font:14px/1.7 'Noto Sans Thai',sans-serif}main{max-width:1180px;padding:25px 28px 40px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}h1{font-size:27px;line-height:1.5;margin:3px 0 6px;letter-spacing:-.5px}p{margin:0}.muted{color:#8a7e92}.eyebrow{font-size:10px;letter-spacing:2px;color:#a392b0}.tag{color:#947ba5;background:#eee6f4;border-radius:8px;font-size:11px;padding:5px 10px;white-space:nowrap}.options{display:grid;gap:12px}.option{background:#fffdfbf5;border:1px solid white;border-radius:20px;padding:20px 24px;display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:center;box-shadow:0 5px 30px #69577306}.info{border-right:1px solid #eee7ef;padding-right:16px}.info h2{font-size:15px;margin:0 0 2px;color:#70607f}.number{color:#c7b5d7;font-size:11px;letter-spacing:1px}.desc{font-size:11px;color:#96899e;margin:5px 0 8px}.sample{font-family:var(--font);display:grid;grid-template-columns:285px 1fr;gap:20px;align-items:center}.logo{font-size:26px;font-weight:600;letter-spacing:-.7px;color:#745ba4;white-space:nowrap}.logo span{color:#e6b555}.caption{font-size:10px;letter-spacing:1.2px;color:#a696ac;margin-top:2px;font-family:var(--font)}.greeting{font-weight:600;font-size:21px;line-height:1.6;margin:0 0 2px}.body-sample{font-size:15px;font-weight:400;color:#85768f;line-height:1.7}.figures{font-size:12px;color:#b1a0bb;margin-top:4px;letter-spacing:1px}button{font:inherit;cursor:pointer;border:0;border-radius:10px}.try{background:#eee8f5;color:#7c659c;padding:7px 12px;font-size:11px}.try:hover{background:#e3d7ef}.try:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b39bd5;outline-offset:3px}footer{text-align:center;color:#a192aa;font-size:11px;margin-top:20px}dialog{border:1px solid white;border-radius:26px;width:min(94vw,460px);padding:24px;background:#fcf9fb;color:#403349;box-shadow:0 20px 120px #68517830}dialog::backdrop{background:#41354d55;backdrop-filter:blur(5px)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:14px}.close{background:#eee7f3;color:#8e789f;width:34px;height:34px;font-size:20px}.phone{font-family:var(--font);background:radial-gradient(at 0 0,#fbded9,transparent 60%),radial-gradient(at 100% 0,#dce9f7,transparent 60%),#fffaf6;border:1px solid white;border-radius:24px;padding:25px 22px}.phone .logo{font-size:24px}.hello{font-size:27px;font-weight:600;line-height:1.5;margin:22px 0 8px}.phone .note{font-size:15px;line-height:1.9;color:#8e7c98}.card{background:#fffefa;border-radius:18px;padding:20px;margin-top:22px;border:1px solid white}.card h3{font:600 18px/1.6 var(--font);margin:0 0 10px}.card p{font:400 14px/1.8 var(--font);color:#87758f}.stars{color:#e4b34b;font-size:24px;letter-spacing:3px;margin:10px 0 5px}.date{font-size:11px!important;color:#a08cad!important}.main-btn{display:block;background:#7960b0;color:white;padding:12px 16px;border-radius:12px;text-align:center;font-family:var(--font);font-size:15px;font-weight:600;width:100%;margin-top:20px}.modal-foot{text-align:center;font-size:11px;color:#a796b1;margin-top:14px}.status{font-size:11px;color:#a291ad;text-align:right;min-height:20px}.loaded{color:#5c8a7a}
@media(max-width:900px){.option{grid-template-columns:160px 1fr;gap:18px}.sample{grid-template-columns:1fr;gap:7px}.logo{font-size:24px}.greeting{font-size:20px}}@media(max-width:600px){main{padding:24px 17px}header{display:block;margin-bottom:22px}h1{font-size:24px}.tag{display:inline-block;margin-top:12px}.status{text-align:left;margin-top:8px}.option{display:block;padding:20px;border-radius:22px}.info{border:0;border-bottom:1px solid #eee7ef;padding:0 0 14px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}.info h2{font-size:16px;grid-column:1}.info .number{grid-column:1}.info .desc{grid-column:1;margin:0}.info .try{grid-column:2;grid-row:1 / 4;align-self:center}.sample{display:block}.sample .logo{font-size:26px}.caption{margin-bottom:16px}.greeting{font-size:22px}.body-sample{font-size:16px}.figures{margin-top:9px}.options{gap:17px}}
</style></head><body><main><header><div><div class="eyebrow">CUBIC CONNECT · TYPOGRAPHY STUDY</div><h1>ตัวอักษรแบบไหน เป็นเราที่สุด?</h1><p class="muted">เทียบข้อความเดียวกัน 5 บุคลิก · ยังไม่เปลี่ยนฟอนต์ในแอปหลัก</p></div><div><span class="tag">ไทย + English · ขนาดและน้ำหนักเท่ากัน</span><p class="status" id="font-status" role="status">กำลังโหลดฟอนต์ตัวอย่าง…</p></div></header><div class="options" id="options"></div><footer>ลองกดดูตัวอย่างบนหน้าจอแอป แล้วบอกหมายเลขที่ชอบในแชตได้เลยค่ะ<br>ตัวอย่างนี้ไม่มีข้อมูลพนักงานจริง</footer></main><dialog id="preview" aria-labelledby="preview-title"></dialog>
<script>
const fonts=[{name:'Mitr',label:'01',desc:'กลมนุ่ม เป็นมิตร มีบุคลิก',source:'Mitr'},{name:'Prompt',label:'02',desc:'สะอาด ร่วมสมัย ดูโตขึ้น',source:'Prompt'},{name:'Bai Jamjuree',label:'03',desc:'โปร่ง เบาสบาย อ่านข้อความยาวได้ดี',source:'Bai+Jamjuree'},{name:'IBM Plex Sans Thai',label:'04',desc:'ชัดเจน สุภาพ มีความเป็นมืออาชีพ',source:'IBM+Plex+Sans+Thai'},{name:'Mali',label:'05',desc:'ลายมือขี้เล่น อบอุ่น น่ารักชัดเจน',source:'Mali'}];
document.getElementById('options').innerHTML=fonts.map((f,i)=>`<article class="option"><div class="info"><div class="number">OPTION ${f.label}</div><h2>${f.name}</h2><p class="desc">${f.desc}</p><button class="try" data-font="${i}">ลองบนหน้าจอแอป ↗</button></div><div class="sample" style="--font:'${f.name}',sans-serif"><div><div class="logo">CUBIC CONNECT<span>✦</span></div><div class="caption">PEOPLE GROW TOGETHER</div></div><div><div class="greeting">ทุกความตั้งใจ มีคนมองเห็น</div><p class="body-sample">ขอบคุณที่ช่วยให้ทีมเติบโตไปด้วยกัน</p><p class="figures">คะแนนของฉัน 4.75 / 5 · 0123456789</p></div></div></article>`).join('');
document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{const f=fonts[Number(b.dataset.font)],d=document.getElementById('preview');d.innerHTML=`<div class="modal-head"><h2 id="preview-title">แบบ ${f.label} · ${f.name}</h2><button class="close" aria-label="ปิดตัวอย่าง">×</button></div><div class="phone" style="--font:'${f.name}',sans-serif"><div class="logo">CUBIC CONNECT<span>✦</span></div><div class="hello">ทุกความตั้งใจ<br>มีคนมองเห็น</div><p class="note">คำชื่นชมเล็ก ๆ ที่ช่วยเติมพลัง<br>ให้วันทำงานของคุณ</p><div class="card"><h3>คำชื่นชมที่ได้รับ</h3><p>ไม่ระบุตัวตน</p><p class="date">วันที่ได้รับ 28 ต.ค. 2569</p><div class="stars">★★★★★</div><p>ขอบคุณที่ช่วยประสานงานอย่างใส่ใจ ทำให้ทีมทำงานต่อได้ราบรื่น</p></div><button class="main-btn" id="mock-button">ดูคะแนนของฉัน</button></div><p class="modal-foot">ตัวอย่างฟอนต์เท่านั้น · ยังไม่ใช่การเลือกใช้จริง</p>`;d.showModal();d.querySelector('.close').onclick=()=>d.close();d.querySelector('#mock-button').onclick=()=>{d.querySelector('#mock-button').textContent='ตัวอย่างคะแนน · 4.75 / 5'};});
Promise.all(fonts.flatMap(f=>[document.fonts.load(`400 16px "${f.name}"`,'กี้มีฟีดแบ็กดี ๆ CUBIC CONNECT'),document.fonts.load(`600 24px "${f.name}"`,'ทุกความตั้งใจ CUBIC CONNECT')])).then(results=>{const ready=results.every(r=>r.length>0);const e=document.getElementById('font-status');e.textContent=ready?'ฟอนต์ทั้ง 5 แบบพร้อมเปรียบเทียบแล้ว':'บางฟอนต์ยังโหลดไม่ได้ กรุณารีเฟรชเมื่อเชื่อมต่ออินเทอร์เน็ต';e.classList.toggle('loaded',ready)}).catch(()=>document.getElementById('font-status').textContent='โหลดฟอนต์ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่');
</script></body></html>
