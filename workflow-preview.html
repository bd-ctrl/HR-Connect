<header><div class="brand">CUBIC CONNECT<span>✦</span><small>SUITCUBE · PEOPLE & CULTURE</small></div><div><span class="pill peach">UI PROTOTYPE</span><p class="scope">ข้อมูลสมมติทั้งหมด</p></div></header>

<main id="app"></main><nav class="nav" aria-label="เมนูตัวอย่าง"><button data-view="received"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#f0b0c8" d="M4 5h24v19H14l-8 5v-5H4z"/><path fill="#c6618e" d="M16 10c-6-5-9 3 0 8 9-5 6-13 0-8"/></svg>ฟีดแบ็กของฉัน</button><button data-view="score"><svg viewBox="0 0 32 32" aria-hidden="true"><rect fill="#dca1be" x="4" y="19" width="6" height="11" rx="2"/><rect fill="#b79ad8" x="13" y="11" width="6" height="19" rx="2"/><rect fill="#7f68b2" x="22" y="3" width="6" height="27" rx="2"/></svg>คะแนนจบรอบ</button><button data-view="hr"><svg viewBox="0 0 32 32" aria-hidden="true"><rect fill="#93beaf" x="5" y="5" width="23" height="25" rx="5"/><rect fill="#518477" x="11" y="2" width="11" height="7" rx="3"/><path d="m10 20 4 4 9-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>HR Portal</button></nav>
<dialog id="review-dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const dims=['ความเร็ว','ความถูกต้อง','การสื่อสาร'];
const blankState=()=>({released:false,releasedAt:null,praisePublishedAt:'2026-10-28T09:00:00+07:00',batch:'ready',filter:'pending',hrTab:'heatmap',period:'current',sort:'original',team:null,decisions:{},audit:[]});let state=blankState(),view=['received','score','hr'].includes(new URLSearchParams(location.search).get('view'))?new URLSearchParams(location.search).get('view'):'received';
const rows=[
 {id:'a',rater:'synthetic-a',scores:[5,5,5],reasons:['แจ้งความคืบหน้าก่อนถึงกำหนด ทำให้ทีมวางแผนต่อได้ง่าย','ตรวจข้อมูลครบก่อนส่ง ทีมจึงทำงานต่อได้ราบรื่น','อธิบายอย่างสุภาพและรับฟัง ช่วยให้การประสานงานสบายใจ']},
 {id:'b',rater:'synthetic-b',scores:[4,4,4],reasons:['ส่งงานภายในเวลาที่ตกลง ขอบคุณที่ช่วยให้ทีมเดินหน้าต่อได้','','แจ้งสิ่งที่ต้องเตรียมชัดเจน เข้าใจตรงกันตั้งแต่แรก']},
 {id:'c',rater:'synthetic-c',scores:[4,4,5],reasons:['ตอบรับและช่วยติดตามงานจนเสร็จ','','ประสานงานสุภาพ แม้มีการปรับรายละเอียดหลายครั้ง']},
 {id:'d',rater:'synthetic-d',scores:[2,3,4],reasons:['ส่งข้อมูลหลังเวลาที่ตกลง 2 วัน โดยไม่มีการแจ้งล่วงหน้า ทำให้ทีมต้องเลื่อนขั้นตอนต่อไป','ข้อมูลที่ส่งขาดบางรายการ ต้องขอรายละเอียดเพิ่มเติมก่อนนำไปใช้','']}
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decision=(r,i)=>r.scores[i]>=4?'auto':state.decisions[r.id+':'+i]?.status||'pending';
const activeRows=()=>state.batch==='small'?rows.slice(0,2):rows;
function calculate(){const ds=dims.map((_,i)=>{const rs=activeRows().filter(r=>['auto','approved'].includes(decision(r,i)));return {count:new Set(rs.map(r=>r.rater)).size,mean:rs.length>=3?rs.reduce((n,r)=>n+r.scores[i],0)/rs.length:null}});return {dims:ds,overall:ds.every(d=>d.mean!==null)?ds.reduce((n,d)=>n+d.mean,0)/3:null}}
function pending(){return activeRows().flatMap(r=>r.scores.map((score,i)=>({r,i,score})).filter(x=>x.score<=3&&decision(r,x.i)==='pending'))}
const fmt=n=>n===null?'—':n.toFixed(2),stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function title(k,h,p){return `<div class="topcopy"><div class="eyebrow">${k}</div><h1>${h}</h1><p class="muted">${p}</p></div>`}
function receivedDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'รอเผยแพร่':date.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'})}
function feedbackCard(r,i,reviewed=false){const d=state.decisions[r.id+':'+i];const text=reviewed?d?.summary:r.reasons[i];return `<article class="feedback"><div class="row"><div class="anonymous"><span class="avatar" aria-hidden="true">✦</span>ไม่ระบุตัวตน</div><span class="dim">${dims[i]}</span></div><p class="feedback-date">วันที่ได้รับ <time datetime="${esc(reviewed?state.releasedAt||'':state.praisePublishedAt)}">${receivedDate(reviewed?state.releasedAt:state.praisePublishedAt)}</time><span> · รอบเผยแพร่</span></p><div class="row" style="margin-top:12px"><span class="stars" aria-label="${r.scores[i]} จาก 5 ดาว">${stars(r.scores[i])}</span><span class="pill ${reviewed?'gray':'green'}">${reviewed?'HR ตรวจสอบแล้ว':'คำชื่นชม'}</span></div><p class="quote">${esc(text||'ผู้ประเมินไม่ได้ระบุข้อความเพิ่มเติม')}</p></article>`}
function received(){const high=activeRows().flatMap(r=>r.scores.map((s,i)=>({r,i,s})).filter(x=>x.s>=4));const released=state.batch==='ready'&&dims.every((_,i)=>new Set(high.filter(x=>x.i===i).map(x=>x.r.rater)).size>=3);return title('MY FEEDBACK','ทุกความตั้งใจ มีคนมองเห็น','คำชื่นชมเล็ก ๆ ที่ช่วยเติมพลังให้วันทำงานของคุณ')+`<div class="grid"><div class="stack"><section class="card hero"><div class="copy"><span class="pill green">ฟีดแบ็กระหว่างรอบ</span><h2 style="margin-top:12px">เก็บคำดี ๆ<br>ไว้เป็นพลังใจ</h2><p class="muted">คำชื่นชมแยกจากคะแนนเฉลี่ย<br>ผลคะแนนอย่างเป็นทางการจะเปิดจบรอบ</p></div><img src="assets/rating-4.gif" alt="น้องดาวยิ้มให้กำลังใจ"></section><section class="card"><div class="row"><h2>คำชื่นชมที่ได้รับ</h2><span class="pill gray">ไม่แสดงชื่อผู้ให้</span></div><p class="muted" style="font-size:12px;margin-bottom:18px">รอบตุลาคม 2569 · แสดงวันที่ได้รับตามรอบเผยแพร่ ไม่แสดงเวลาส่งหรือชื่อโปรเจกต์</p><div class="stack">${released?high.map(x=>feedbackCard(x.r,x.i)).join(''):`<div class="empty"><span class="badge-icon">✦</span><h3>รอฟีดแบ็กพร้อมแสดง</h3><p>${state.batch==='small'?'ข้อมูลยังไม่ครบเกณฑ์ขั้นต่ำ จึงยังไม่แสดงคะแนนหรือข้อความ':'รวบรวมฟีดแบ็กเป็นชุดก่อนเผยแพร่ เพื่อช่วยปกป้องผู้ให้ความคิดเห็น'}</p></div>`}</div></section></div><aside class="stack"><section class="card"><h3>พื้นที่นี้แสดงอะไรบ้าง?</h3><div class="step"><span class="bubble">1</span><div><strong>คำชื่นชม 4–5 ดาว</strong><p>แสดงเมื่อมีข้อมูลผ่านเกณฑ์ความเป็นส่วนตัวและพร้อมเผยแพร่เป็นชุด</p></div></div><div class="step"><span class="bubble">2</span><div><strong>เหตุผลที่คนอื่นชื่นชมคุณ</strong><p>ผู้ให้จะใส่หรือไม่ใส่ข้อความก็ได้</p></div></div><div class="step"><span class="bubble">3</span><div><strong>เห็นเฉพาะฟีดแบ็กของคุณ</strong><p>ไม่แสดงตัวตนผู้ให้หรือคะแนนของเพื่อนร่วมงาน</p></div></div><div class="hint">คำชื่นชมระหว่างรอบยังไม่ใช่คะแนนเฉลี่ยอย่างเป็นทางการ</div><button class="btn soft" data-view="score" style="margin-top:16px;width:100%">ดูสถานะคะแนนจบรอบ</button></section><section class="card"><label for="batch">ลองสถานะการแสดงผล · จำลอง</label><select id="batch"><option value="ready" ${state.batch==='ready'?'selected':''}>พร้อมแสดงเป็นชุด</option><option value="waiting" ${state.batch==='waiting'?'selected':''}>รอเผยแพร่เป็นชุด</option><option value="small" ${state.batch==='small'?'selected':''}>ผู้ประเมินไม่ครบ 3 คน</option></select><p class="scope">ตัวเลือกนี้ใช้ตรวจหน้าจอต้นแบบเท่านั้น</p></section></aside></div>`}
function barHTML(result){return `<div class="bars">${dims.map((d,i)=>`<div class="barrow"><span>${d}</span><div class="track"><i style="width:${(result.dims[i].mean||0)*20}%"></i></div><strong>${fmt(result.dims[i].mean)}</strong></div>`).join('')}</div>`}
function scoreView(){const result=calculate();const low=activeRows().flatMap(r=>r.scores.map((s,i)=>({r,i,s})).filter(x=>x.s<=3&&decision(r,x.i)==='approved'&&result.dims[x.i].mean!==null));return title('MY ROUND RESULT','คะแนนจบรอบของฉัน','ผลที่ผ่านกระบวนการตรวจสอบ และพร้อมสำหรับการพัฒนาร่วมกัน')+`<div class="grid"><div class="stack">${!state.released?`<section class="card lock"><img src="assets/rating-3.png" alt="น้องดาวกำลังรอผล"><h2>รอเผยแพร่คะแนนจบรอบ</h2><p class="muted">ผลคะแนนจะเปิดพร้อมกันหลังปิดรอบ<br>และ HR ตรวจสอบเสร็จแล้ว</p><span class="pill gray" style="margin-top:16px">ยังไม่แสดงค่าเฉลี่ยระหว่างรอบ</span><div class="divider"></div><p class="scope">ยังดูคำชื่นชมที่พร้อมแสดงได้ในหน้าฟีดแบ็กของฉัน</p><button class="btn soft" data-view="received" style="margin-top:14px">กลับไปอ่านคำชื่นชม</button></section>`:`<section class="card"><div class="row"><span class="pill green">เผยแพร่ผลจบรอบแล้ว</span><span class="scope">ตุลาคม 2569</span></div><h2 style="margin-top:20px">ภาพรวมความร่วมมือของฉัน</h2><div class="bigscore">${fmt(result.overall)}<small> / 5</small></div><p class="muted" style="font-size:12px">${result.overall===null?'ข้อมูลไม่เพียงพอในบางด้าน จึงยังไม่แสดงคะแนนรวม':'ค่าเฉลี่ย 3 ด้าน น้ำหนักเท่ากัน'}</p>${barHTML(result)}<div class="hint green">ใช้เฉพาะคะแนนที่ผ่านเกณฑ์และการตรวจสอบแล้ว แต่ละด้านต้องมีผู้ประเมินที่นำมาคำนวณได้อย่างน้อย 3 คน</div></section><section class="card"><h2>เรื่องที่ชวนพัฒนาร่วมกัน</h2><p class="muted" style="font-size:12px;margin-bottom:17px">เฉพาะข้อมูลที่ HR ตรวจสอบและเรียบเรียงก่อนเผยแพร่</p><div class="stack">${low.length?low.map(x=>feedbackCard(x.r,x.i,true)).join(''):'<div class="empty">ไม่มีข้อเสนอแนะเพื่อพัฒนาที่พร้อมเผยแพร่ในรอบนี้</div>'}</div></section>`}</div><aside class="stack"><section class="card"><h3>คะแนนนี้มาจากอะไร?</h3><div class="step"><span class="bubble">✓</span><div><strong>คะแนน 4–5 ดาว</strong><p>ผ่านอัตโนมัติ พร้อมใช้เมื่อถึงรอบคำนวณ</p></div></div><div class="step"><span class="bubble">✓</span><div><strong>คะแนน 1–3 ดาว</strong><p>ใช้เฉพาะรายการที่ HR ตรวจสอบข้อเท็จจริงและอนุมัติแล้ว</p></div></div><div class="hint">ผู้รับจะไม่เห็นรายการรอตรวจสอบ รายการ Reject หรือตัวตนผู้ประเมิน</div></section><section class="card"><span class="pill peach">สำหรับลองหน้าจอเท่านั้น</span><p class="muted" style="font-size:13px;margin:12px 0">สลับไปมุม HR จำลอง เพื่อลองตรวจสอบและเผยแพร่ผล</p><button class="btn soft" data-view="hr">ลองมุม HR</button></section></aside></div>`}
function hrView(){const all=activeRows().flatMap(r=>r.scores.map((score,i)=>({r,i,score})).filter(x=>x.score<=3));const items=all.filter(x=>state.filter==='all'||decision(x.r,x.i)===state.filter);const result=calculate(),enough=new Set(activeRows().map(r=>r.rater)).size>=3;return title('HR REVIEW · DEMO','ตรวจสอบก่อนส่งต่อ','พื้นที่จำลองของ HR Manager / HR Admin · พิจารณาแยกทีละด้าน')+`<div class="hint peach">คะแนนและเหตุผลในหน้านี้เป็นข้อมูลสมมติทั้งหมด มุมพนักงานไม่เห็นรายการรอตรวจสอบหรือสถานะ Reject</div><div class="summary"><div class="stat"><small>รอตรวจสอบ</small><strong>${enough?pending().length:'—'}</strong></div><div class="stat"><small>อนุมัติแล้ว</small><strong>${all.filter(x=>decision(x.r,x.i)==='approved').length}</strong></div><div class="stat"><small>ไม่นำมาคำนวณ</small><strong>${all.filter(x=>decision(x.r,x.i)==='rejected').length}</strong></div></div><div class="grid"><section class="card"><div class="row"><h2>คิวคะแนน 1–3 ดาว</h2><span class="pill peach">SLA ตัวอย่าง · 3 วัน</span></div><div class="filter"><label class="sr-only" for="filter">กรองสถานะ</label><select id="filter">${[['pending','รอตรวจสอบ'],['approved','อนุมัติแล้ว'],['rejected','Reject แล้ว'],['all','ทั้งหมด']].map(([v,l])=>`<option value="${v}" ${state.filter===v?'selected':''}>${l}</option>`).join('')}</select><span class="notice-count">ประเมินจากประสบการณ์ร่วมงานจริง</span></div>${!enough?'<div class="empty">ผู้ประเมินไม่ครบ 3 คน<br>ไม่นำข้อมูลชุดนี้เข้าสู่คิวหรือการคำนวณ</div>':items.length?items.map(x=>{const st=decision(x.r,x.i),d=state.decisions[x.r.id+':'+x.i];return `<article class="feedback case"><div class="row"><div><span class="dim">${dims[x.i]}</span><h3>พนักงานตัวอย่าง · BA</h3></div><span class="score">${x.score}<small> / 5</small></span></div><span class="pill gray">ไม่แสดงชื่อผู้ประเมิน</span><blockquote>${esc(x.r.reasons[x.i])}</blockquote><p class="scope">${st==='pending'?'ยังไม่ส่งคะแนนหรือข้อความให้ผู้รับ':st==='approved'?'อนุมัติแล้ว · พร้อมนำไปคำนวณจบรอบ':'Reject แล้ว · ไม่นำไปคำนวณและไม่แจ้งทั้งสองฝ่าย'}</p>${d?`<div class="reviewed"><strong class="dim">บันทึก HR · จำกัดเฉพาะหลังบ้าน</strong><p style="font-size:13px">${esc(d.note)}</p>${st==='approved'?`<p class="scope">ข้อความพร้อมเผยแพร่: ${esc(d.summary)}</p>`:''}</div>`:''}${st==='pending'&&!state.released?`<div class="actions"><button class="btn" data-review="${x.r.id}:${x.i}:approved">Approve</button><button class="btn reject" data-review="${x.r.id}:${x.i}:rejected">Reject</button></div>`:''}</article>`}).join(''):'<div class="empty">ไม่มีรายการในสถานะนี้<br><button class="btn text" id="all-cases">ดูรายการทั้งหมด</button></div>'}</section><aside class="stack"><section class="card"><span class="pill gray">เฉพาะ HR · ยังไม่ใช่ผลเผยแพร่</span><h2 style="margin-top:15px">ตัวอย่างผลคำนวณ</h2><div class="bigscore" style="font-size:46px">${fmt(result.overall)}<small> / 5</small></div>${barHTML(result)}<p class="scope">คะแนนรอตรวจสอบและ Reject ไม่อยู่ทั้งตัวตั้งและตัวหาร อนุมัติแล้วจึงคำนวณใหม่</p><div class="divider"></div><h3>เผยแพร่พร้อมกันจบรอบ</h3><p class="muted" style="font-size:13px">ตรวจทุกกรณีให้ครบก่อน ผู้รับจึงเห็นคะแนนอย่างเป็นทางการ</p><button class="btn" id="publish" style="width:100%;margin-top:15px" ${pending().length||state.released||!enough?'disabled':''}>${state.released?'เผยแพร่แล้ว':'ปิดรอบและเผยแพร่ผล'}</button>${pending().length&&enough?'<p class="scope">ยังมีรายการรอตรวจสอบ จึงยังเผยแพร่ไม่ได้</p>':''}</section><section class="card"><h3>หลักในการพิจารณา</h3><p class="muted" style="font-size:13px">ตรวจพฤติกรรม บริบท และผลต่องาน ใช้เกณฑ์เดียวกันทุกคน ไม่ Reject เพียงเพราะเป็นคะแนนต่ำ</p><div class="hint" style="margin-top:12px">ทุกการตัดสินใจต้องมีบันทึกเหตุผล ผู้รับเห็นเฉพาะข้อความที่พร้อมเผยแพร่</div><button class="btn text" id="reset">เริ่มตัวอย่างใหม่</button></section></aside></div>`}
const departments=['Project Co','HR','MKT','ACC','PA','OPL','CS','BD','Sale','Warehouse','BA'];
const demoTeams={OPL:[[2.67,3.67,4],[3,4,4],[3.33,3.67,4.33]],MKT:[[4.67,4.33,4.67],[4.33,4.67,4.33],[4.67,4.67,4.67]],HR:[[4,4.33,4.67],[4.33,4.33,4],[4,4.67,4.33]]};
const historyShift={'2026-07':-.3,'2026-08':-.15,'2026-09':0};
function teamMembers(dept,period=state.period){
 if(dept==='BA'){
  const r=period==='current'?calculate():{dims:[{mean:4,count:3},{mean:4.33,count:3},{mean:4.33,count:3}],overall:(4+4.33+4.33)/3};
  return [{id:'ba-example',name:'พนักงานตัวอย่าง · BA',dims:r.dims,overall:r.overall,raters:period==='current'?new Set(activeRows().map(r=>r.rater)).size:3}];
 }
 return (demoTeams[dept]||[]).map((values,j)=>{const shift=period==='current'?.08:historyShift[period]||0;const ds=values.map(v=>({mean:Math.max(1,Math.min(5,v+shift)),count:3}));return {id:dept+'-'+j,name:'พนักงานตัวอย่าง '+dept+' '+String(j+1).padStart(2,'0'),dims:ds,overall:ds.reduce((n,d)=>n+d.mean,0)/3,raters:3}});
}
function teamResult(dept,period=state.period){const ms=teamMembers(dept,period),ds=dims.map((_,i)=>{const reportable=ms.filter(m=>m.dims[i].count>=3&&m.dims[i].mean!==null);return reportable.length?reportable.reduce((n,m)=>n+m.dims[i].mean,0)/reportable.length:null});return {dept,members:ms,dims:ds,overall:ds.every(n=>n!==null)?ds.reduce((a,b)=>a+b,0)/3:null,eligible:ms.filter(m=>m.overall!==null).length};}
function orderedTeams(){const ts=departments.map(d=>teamResult(d));if(state.sort==='high'||state.sort==='low')ts.sort((a,b)=>a.overall===null?(b.overall===null?0:1):b.overall===null?-1:state.sort==='high'?b.overall-a.overall:a.overall-b.overall);return ts;}
function heatTone(v){return v===null?'heat-empty':v>=4?'heat-good':v>=3?'heat-mid':'heat-low';}
function hrPortal(){return `<div class="hr-portal"><span class="pill gray">HR PORTAL · มุมมองจำลอง</span><div class="tabs hr-tabs" role="tablist" aria-label="เมนู HR Portal"><button data-hr-tab="heatmap" role="tab" aria-selected="${state.hrTab==='heatmap'}" class="${state.hrTab==='heatmap'?'active':''}">Dashboard Heatmap</button><button data-hr-tab="queue" role="tab" aria-selected="${state.hrTab==='queue'}" class="${state.hrTab==='queue'?'active':''}">คิวตรวจสอบ 1–3 ดาว</button></div>${state.hrTab==='heatmap'?heatmapView():hrView()}</div>`;}
function rankedDepartments(){const ordered=departments.map(d=>teamResult(d)).filter(t=>t.overall!==null).sort((a,b)=>b.overall-a.overall);return ordered.map((t,i)=>({...t,rank:i&&fmt(ordered[i-1].overall)===fmt(t.overall)?ordered.findIndex(x=>fmt(x.overall)===fmt(t.overall))+1:i+1}));}
function departmentRanking(){const all=rankedDepartments(),top=all.filter(t=>t.rank<=3);return `<section class="card department-ranking" aria-labelledby="ranking-title"><div class="row"><div><span class="eyebrow">DEPARTMENT RANKING · HR ONLY</span><h2 id="ranking-title">ลำดับคะแนนตามแผนก</h2></div><span class="pill gray">ข้อมูลสมมติ</span></div><p class="scope">เฉพาะแผนกที่มีข้อมูลผ่านเกณฑ์ · รอบเดียวกับ Heatmap · คะแนนเท่ากันแสดงลำดับร่วม</p>${top.length?`<div class="ranking-grid">${top.map(t=>`<article class="rank-card rank-${t.rank}"><img src="assets/rank-star-${t.rank}-crayon.png" alt="${t.rank===1?'น้องดาวใส่มงกุฎถือถ้วยเลข 1 พร้อมประกาย':t.rank===2?'น้องดาวถือป้ายเลข 2 มีประกายเล็กน้อย':'น้องดาวถือป้ายเลข 3 ไม่มีประกาย'}" width="132" height="132"><div><span class="rank-label">ลำดับ ${t.rank}${all.filter(x=>x.rank===t.rank).length>1?' ร่วม':''}</span><h3>${esc(t.dept)}</h3><div class="rank-value">${fmt(t.overall)}<small> / 5</small></div><p class="scope">ผ่านเกณฑ์ ${t.eligible} / ${t.members.length} คน</p><button class="btn soft" data-team="${esc(t.dept)}">ดูแผนก</button></div></article>`).join('')}</div>`:'<div class="empty">ยังไม่มีแผนกที่มีข้อมูลผ่านเกณฑ์สำหรับแสดงลำดับ</div>'}<p class="scope" style="margin-top:14px">ใช้ดูทิศทางร่วมกับขนาดกลุ่มและลักษณะงาน ไม่ใช่ข้อสรุปเปรียบเทียบความสามารถข้ามบทบาท</p></section>`;}

function heatmapView(){const teams=orderedTeams(),valid=teams.filter(t=>t.overall!==null);return title('HR ANALYTICS','ภาพรวมความร่วมมือ แยกตามแผนก','มองเห็นจุดแข็งและประเด็นที่ควรชวนทีมพัฒนา')+`<div class="filter heat-controls"><div><label for="heat-period">รอบรายงาน</label><select id="heat-period"><option value="current" ${state.period==='current'?'selected':''}>ต.ค. 2569 · ${state.released?'เผยแพร่แล้ว':'กำลังตรวจสอบ'}</option><option value="2026-09" ${state.period==='2026-09'?'selected':''}>ก.ย. 2569 · เผยแพร่แล้ว</option><option value="2026-08" ${state.period==='2026-08'?'selected':''}>ส.ค. 2569 · เผยแพร่แล้ว</option><option value="2026-07" ${state.period==='2026-07'?'selected':''}>ก.ค. 2569 · เผยแพร่แล้ว</option></select></div><div><label for="heat-sort">เรียงแผนก</label><select id="heat-sort"><option value="original" ${state.sort==='original'?'selected':''}>ตามรายชื่อแผนก</option><option value="high" ${state.sort==='high'?'selected':''}>คะแนนสูง → ต่ำ</option><option value="low" ${state.sort==='low'?'selected':''}>คะแนนต่ำ → สูง</option></select></div></div><div class="summary"><div class="stat"><small>แผนกทั้งหมด</small><strong>${departments.length}</strong></div><div class="stat"><small>มีข้อมูลผ่านเกณฑ์</small><strong>${valid.length}<span class="stat-unit"> แผนก</span></strong></div><div class="stat"><small>คิวรอตรวจ · รอบปัจจุบัน</small><strong>${pending().length}<span class="stat-unit"> ด้าน</span></strong></div></div>${departmentRanking()}<section class="card"><div class="row"><h2>Department Heatmap</h2><span class="pill ${state.period==='current'&&!state.released?'peach':'green'}">${state.period==='current'&&!state.released?'เฉพาะ HR · ยังไม่ใช่คะแนนสุดท้าย':'ผลจบรอบ'}</span></div><p class="muted" style="font-size:12px;margin-bottom:15px">กดชื่อแผนกเพื่อดูรายบุคคล · คะแนนรอตรวจและ Reject ไม่นำมาคำนวณ</p><div class="heat-scroll" tabindex="0" role="region" aria-label="ตาราง Heatmap แผนก เลื่อนแนวนอนได้"><table class="department-heatmap"><thead><tr><th scope="col">แผนก</th>${dims.map(d=>`<th scope="col">${d}</th>`).join('')}<th scope="col">รวม</th><th scope="col">ครอบคลุม</th></tr></thead><tbody>${teams.map(t=>`<tr><th scope="row"><button class="team-link" data-team="${esc(t.dept)}">${esc(t.dept)} <span aria-hidden="true">↗</span></button></th>${[...t.dims,t.overall].map(v=>`<td class="${heatTone(v)}" aria-label="${v===null?'ข้อมูลไม่เพียงพอ':fmt(v)+' จาก 5 ดาว'}">${fmt(v)}</td>`).join('')}<td class="coverage">${t.members.length?t.eligible+' / '+t.members.length:'—'}</td></tr>`).join('')}</tbody></table></div><div class="heat-legend"><span><i class="heat-good"></i>4–5</span><span><i class="heat-mid"></i>3–น้อยกว่า 4</span><span><i class="heat-low"></i>ต่ำกว่า 3</span><span><i class="heat-empty"></i>— ข้อมูลไม่เพียงพอ</span></div><p class="scope">ครอบคลุม = พนักงานที่มีคะแนนรวมผ่านเกณฑ์ / พนักงานในข้อมูลต้นแบบของแผนกนั้น</p><div class="hint" style="margin-top:16px">สรุปค่าเฉลี่ยรายบุคคลที่ผ่านเกณฑ์ แต่ละคนมีน้ำหนักเท่ากัน ไม่ใช่ผลประเมินบริการของแผนกโดยตรง ใช้ร่วมกับจำนวนผู้ประเมิน บริบทงาน และข้อเท็จจริง ไม่ใช้ลำดับคะแนนตัดสินว่าแผนกใดดีกว่ากัน</div></section>${state.team?teamDetail(state.team):'<section class="card" style="margin-top:20px"><h3>เริ่มจากการเลือกแผนก</h3><p class="muted">ดูคะแนนรายบุคคล แนวโน้ม และรายการที่ควรติดตามในพื้นที่ของ HR</p></section>'}`;}
function teamDetail(dept){const t=teamResult(dept),trend=['2026-07','2026-08','2026-09',...(state.period==='current'?['current']:[])].map(p=>({p,value:teamResult(dept,p).overall}));return `<section class="card team-detail" id="team-detail" aria-labelledby="team-title"><div class="row"><div><span class="eyebrow">DEPARTMENT DETAIL · HR ONLY</span><h2 id="team-title">${esc(dept)} · คะแนนรายบุคคล</h2></div><button class="btn soft" id="close-team" aria-label="ปิดรายละเอียดแผนก">ปิด</button></div>${!t.members.length?'<div class="empty">แผนกนี้ยังไม่มีรายชื่อหรือคะแนนในข้อมูลต้นแบบ<br>ระบบไม่แทนข้อมูลที่ขาดด้วยคะแนนศูนย์</div>':`<p class="scope">แต่ละด้านต้องมีผู้ประเมินที่ใช้คำนวณได้อย่างน้อย 3 คน ข้อมูลไม่ครบจะแสดงเป็นขีด</p><div class="heat-scroll"><table class="department-heatmap individual-table"><thead><tr><th scope="col">พนักงานตัวอย่าง</th>${dims.map(d=>`<th scope="col">${d}</th>`).join('')}<th scope="col">รวม</th><th scope="col">ผู้ประเมิน*</th></tr></thead><tbody>${t.members.map(m=>`<tr><th scope="row">${esc(m.name)}</th>${[...m.dims.map(d=>d.mean),m.overall].map(v=>`<td class="${heatTone(v)}">${fmt(v)}</td>`).join('')}<td class="coverage">${m.raters}</td></tr>`).join('')}</tbody></table></div><p class="scope">* ผู้ประเมินไม่ซ้ำทั้งหมด ไม่ใช่จำนวนที่ใช้คำนวณทุกด้าน ซึ่งอาจต่างกันหลัง HR พิจารณา</p><h3 style="margin-top:24px">แนวโน้มแผนก</h3><div class="trend-points">${trend.map(x=>`<div><span class="trend-stick" style="height:${(x.value||0)*17}px"></span><strong>${fmt(x.value)}</strong><small>${{'2026-07':'ก.ค.','2026-08':'ส.ค.','2026-09':'ก.ย.',current:'ต.ค.*'}[x.p]}</small></div>`).join('')}</div><p class="scope">ข้อมูลแนวโน้มสมมติ · * ต.ค. ยังเป็นข้อมูลระหว่างตรวจสอบหากยังไม่เผยแพร่</p>${dept==='BA'&&state.period==='current'?`<div class="hint peach">${pending().length?'มีคะแนน 1–3 ดาวที่ยังต้องตรวจสอบ จึงยังไม่รวมคะแนนส่วนนั้นใน Heatmap':'ตรวจสอบคะแนนด้านที่รอครบแล้ว'}<br><button class="btn soft" data-open-queue style="margin-top:10px">เปิดคิวตรวจสอบ BA</button></div>`:'<div class="hint green">ใช้ผลเพื่อคุยเรื่องกระบวนการและวางแผนพัฒนา ไม่สรุปว่าใครเป็นต้นเหตุจากคะแนนเพียงอย่างเดียว</div>'}`}</section>`;}
function bindHeatmap(){document.querySelectorAll('[data-hr-tab]').forEach(b=>b.onclick=()=>{state.hrTab=b.dataset.hrTab;render();window.scrollTo(0,0)});document.querySelector('#heat-sort')?.addEventListener('change',e=>{state.sort=e.target.value;render()});document.querySelector('#heat-period')?.addEventListener('change',e=>{state.period=e.target.value;render()});document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{state.team=b.dataset.team;render();document.querySelector('#team-detail')?.scrollIntoView({behavior:'auto',block:'start'})});document.querySelector('#close-team')?.addEventListener('click',()=>{state.team=null;render()});document.querySelector('[data-open-queue]')?.addEventListener('click',()=>{state.hrTab='queue';state.filter='pending';render();window.scrollTo(0,0)});}

function render(){document.getElementById('app').innerHTML=({received,score:scoreView,hr:hrPortal}[view])()+`<footer>CUBIC CONNECT · ฟังกัน เข้าใจกัน เติบโตไปด้วยกัน<br>ต้นแบบ UI · ข้อมูลในหน่วยความจำเบราว์เซอร์ ไม่ใช่ระบบสิทธิ์ HR หรือฐานข้อมูลจริง</footer>`;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();window.scrollTo(0,0)});document.querySelector('#batch')?.addEventListener('change',e=>{state.batch=e.target.value;state.released=false;render()});document.querySelector('#filter')?.addEventListener('change',e=>{state.filter=e.target.value;render()});document.querySelector('#all-cases')?.addEventListener('click',()=>{state.filter='all';render()});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review));document.querySelector('#publish')?.addEventListener('click',publish);document.querySelector('#reset')?.addEventListener('click',()=>{state=blankState();render();toast('เริ่มข้อมูลตัวอย่างใหม่แล้ว')});bindHeatmap()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;setTimeout(()=>el.hidden=true,3000)}
function review(key){const [id,index,status]=key.split(':'),i=Number(index),r=activeRows().find(r=>r.id===id);if(!r||r.scores[i]>=4||decision(r,i)!=='pending'||state.released||new Set(activeRows().map(r=>r.rater)).size<3)return;const approved=status==='approved';const dialog=document.getElementById('review-dialog');dialog.innerHTML=`<h2 id="dialog-title">${approved?'อนุมัติคะแนนด้านนี้':'Reject คะแนนด้านนี้'}</h2><span class="pill peach">${dims[i]} · ${r.scores[i]} ดาว</span><p class="muted" style="font-size:13px;margin-top:12px">${approved?'คะแนนจะพร้อมใช้คำนวณ แต่ผู้รับจะเห็นเมื่อเผยแพร่จบรอบ':'ไม่นำคะแนนนี้ไปคำนวณ ไม่แจ้งผู้ให้หรือผู้รับ'}</p><form id="decision-form"><label for="note">ข้อเท็จจริง / เหตุผลการตัดสินใจ *</label><textarea id="note" required maxlength="500" placeholder="บันทึกผลการตรวจสอบ ใช้เฉพาะ HR"></textarea>${approved?'<label for="summary">ข้อความสำหรับผู้รับหลังเผยแพร่ *</label><textarea id="summary" required maxlength="500" placeholder="สรุปประเด็นพัฒนาโดยตัดชื่อ โปรเจกต์เฉพาะ และรายละเอียดระบุตัวผู้ให้"></textarea>':''}<p id="decision-error" class="error" role="alert"></p><div class="actions"><button class="btn ${approved?'':'reject'}" type="submit">ยืนยัน ${approved?'Approve':'Reject'}</button><button class="btn soft" type="button" id="cancel">กลับไปตรวจสอบ</button></div></form>`;dialog.showModal();dialog.querySelector('#cancel').onclick=()=>dialog.close();dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const note=dialog.querySelector('#note').value.trim(),summary=dialog.querySelector('#summary')?.value.trim()||'';if(!note||(approved&&!summary)){dialog.querySelector('#decision-error').textContent='กรุณากรอกข้อมูลที่จำเป็นให้ครบ';return}if(decision(r,i)!=='pending'||state.released)return;state.decisions[id+':'+i]={status,note,summary};state.audit.push({key:id+':'+i,status,note});dialog.close();render();toast(approved?'อนุมัติแล้ว · พร้อมคำนวณจบรอบ':'Reject แล้ว · ไม่ส่งแจ้งเตือนพนักงาน')};}
function publish(){if(pending().length||state.released||new Set(activeRows().map(r=>r.rater)).size<3)return;const dialog=document.getElementById('review-dialog');dialog.innerHTML='<h2 id="dialog-title">เผยแพร่ผลจบรอบ?</h2><p>ตรวจสอบคะแนนครบแล้ว ผู้รับจะเห็นเฉพาะคะแนนที่ผ่านเกณฑ์และข้อความที่ HR เรียบเรียงไว้</p><div class="actions"><button class="btn" id="confirm-publish">ยืนยันเผยแพร่</button><button class="btn soft" id="cancel-publish">กลับ</button></div>';dialog.showModal();dialog.querySelector('#cancel-publish').onclick=()=>dialog.close();dialog.querySelector('#confirm-publish').onclick=()=>{if(pending().length||state.released)return;state.released=true;state.releasedAt=new Date().toISOString();dialog.close();view='score';render();window.scrollTo(0,0);toast('เผยแพร่ผลตัวอย่างแล้ว')};}
render();
</script></body></html>
